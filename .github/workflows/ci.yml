name: POS build and Windows setup

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Parse Windows setup scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($script in Get-ChildItem windows-installer/scripts/*.ps1) {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Start disposable PostgreSQL 16 tests (Linux)
        if: runner.os == 'Linux'
        run: |
          test -x /usr/lib/postgresql/16/bin/initdb
          POS_TEST_PG_BIN=/usr/lib/postgresql/16/bin python3 tools/postgres-test.py
      - name: Start disposable PostgreSQL 16.15 tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $archive=& .\windows-installer\scripts\Dependencies.ps1 -Name postgres
          $testRuntime=Join-Path $env:RUNNER_TEMP 'stage3-postgres-runtime'
          New-Item $testRuntime -ItemType Directory -Force|Out-Null
          & (Join-Path $env:SystemRoot 'System32\tar.exe') -xf $archive -C $testRuntime 'pgsql/bin' 'pgsql/lib' 'pgsql/share'
          if($LASTEXITCODE -ne 0){throw 'Cannot extract verified PostgreSQL test binaries'}
          $env:POS_TEST_PG_BIN=Join-Path $testRuntime 'pgsql\bin'
          python tools/postgres-test.py
          if($LASTEXITCODE -ne 0){throw 'Cannot start disposable test database'}
      - name: Build, format, analyse and test (Linux)
        if: runner.os == 'Linux'
        run: ./mvnw -B -ntp clean install
      - name: Build, format, analyse and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\mvnw.cmd -B -ntp clean install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch actual JavaFX setup window (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          .\mvnw.cmd -B -ntp -pl pos-desktop javafx:run '-Ddesktop.args=--smoke-test' | Tee-Object -Variable smokeOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($smokeOutput -join "`n") -notmatch 'DESKTOP_SMOKE_OK') { throw 'JavaFX smoke marker absent' }
          if (($smokeOutput -join "`n") -notmatch 'DESKTOP_CDI_CLOSED') { throw 'CDI shutdown marker absent' }
      - name: Build unsigned Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: .\windows-installer\scripts\Build-Package.ps1 -Channel Development
      - name: Test packaged application and provisioning
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: powershell
        run: .\windows-installer\scripts\Test-Package.ps1
      - name: Stop disposable test PostgreSQL
        if: always()
        shell: pwsh
        run: |
          if($env:POS_TEST_CLUSTER_ROOT){
            & (Join-Path $env:POS_TEST_PG_BIN 'pg_ctl') -D (Join-Path $env:POS_TEST_CLUSTER_ROOT 'data') -m fast -w stop
          }
      - name: Publish private Windows test installer
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-development-installer
          path: |
            windows-installer/target/*.exe
            windows-installer/target/SHA256SUMS.txt
            windows-installer/target/packaged-fx*.log
            windows-installer/target/stage/release-manifest.json
          if-no-files-found: warn
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-evidence-${{ matrix.os }}
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
            **/target/checkstyle-result.xml
          if-no-files-found: warn

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan source and history without printing secrets
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
