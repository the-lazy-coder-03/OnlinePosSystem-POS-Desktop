# Explicit development only. Use the installed profile and mTLS on Windows terminals.
pos.database.url=${POS_DB_URL}
pos.database.password=${POS_DB_RUNTIME_PASSWORD}
pos.branch-id=${POS_BRANCH_ID}
pos.cluster-id=${POS_CLUSTER_ID}
pos.installation-id=${POS_INSTALLATION_ID}
# Optional explicit loopback terminal for local API development, never honored by installed profile.
pos.development-terminal=${POS_DEV_TERMINAL:}

# Dedicated local login inherits only pos_runtime; installed service remains fixed.
pos.database.username=${POS_DB_RUNTIME_USERNAME:pos_runtime}
pos.pin-key=${POS_PIN_KEY:}
