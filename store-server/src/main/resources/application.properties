spring.application.name=onlinepos-store-server
server.address=127.0.0.1
server.port=18090
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
spring.jackson.deserialization.fail-on-unknown-properties=true
# Development-only liveness process. No datasource, cloud worker, credentials or write API.
# Trusted LAN HTTPS and role provisioning are Stage 2; PostgreSQL/auth are Stage 3.
